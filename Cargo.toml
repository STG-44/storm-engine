[workspace]
members = ["rust/crates/storm-core", "rust/crates/storm-render", "rust/crates/storm-formats", "rust/crates/storm-sim", "rust/apps/storm-demo"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/STG-44/storm-engine"

[workspace.dependencies]
anyhow = "1.0"
bytemuck = { version = "1.24", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
glam = { version = "0.34.1", default-features = false, features = ["std"] }
png = "0.18"
pollster = "0.4"
serde_json = "1.0"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
